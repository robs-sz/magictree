[package]
name = "magictree"
version = "0.1.2"
edition = "2021"
description = "Per-worktree development environments"

[lib]
name = "magictree"
path = "src/lib.rs"

[[bin]]
name = "magictree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
nix = { version = "0.29", features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
ureq = "2"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
