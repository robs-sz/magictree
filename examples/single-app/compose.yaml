services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: shop
    ports:
      - "${WT_PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate-db:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: shop
    command: ["psql", "-h", "postgres", "-U", "postgres", "-c", "select 1"]
