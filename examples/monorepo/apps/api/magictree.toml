version = 1

[app]
id = "api"

[bootstrap]
run = [{ command = "uv sync --group dev", inputs = ["pyproject.toml"] }]

[[services]]
id = "api"
target = { kind = "uv", script = "dev" }
port = { env = "API_PORT", prefer = 8000 }
needs = ["db", "redis"]
health = { http = "/healthz", timeout = 60 }

[jobs.seed]
run = "uv run python -m app.seed"
when = "manual"
needs = ["api"]
