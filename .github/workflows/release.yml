name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ github.workflow }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.workflow }}-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          tar -czf "dist/magictree-$version-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" magictree

      - uses: actions/upload-artifact@v7
        with:
          name: magictree-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$tag"
          else
            range="$tag"
          fi
          git log --no-merges --invert-grep --grep='^release v[0-9]' \
            --pretty='%s' "$range" | awk '
            function bullet(list, n,   i) { for (i = 1; i <= n; i++) print "- " list[i] }
            function strip(s) { sub(/^[a-zA-Z]+(\([^)]*\))?!?: /, "", s); return s }
            /^feat(\([^)]*\))?!?: / { feat[++nf] = strip($0); next }
            /^fix(\([^)]*\))?!?: / { fix[++nx] = strip($0); next }
            /^docs?(\([^)]*\))?!?: / { docs[++nd] = strip($0); next }
            { other[++no] = $0 }
            END {
              if (nf) { print "### Features"; bullet(feat, nf); print "" }
              if (nx) { print "### Bug Fixes"; bullet(fix, nx); print "" }
              if (nd) { print "### Documentation"; bullet(docs, nd); print "" }
              if (no) { print "### Other Changes"; bullet(other, no); print "" }
            }' > "$RUNNER_TEMP/notes.md"
          if [ -n "$previous" ]; then
            printf '**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$tag" \
              >> "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" dist/*.tar.gz --clobber
